name: CI - full test suite

# Executa a suíte completa de testes (unit + integração HTTP + schema) contra
# uma stack real provisionada pelo próprio runner: dois servidores PostgreSQL
# fisicamente separados, o MockServer do provedor de análise e a API viva
# (uvicorn). Como a suíte de integração exige todos esses serviços no ar ao
# mesmo tempo, este workflow é a forma reprodutível de obter evidência verde.
#
# A contagem de testes desta baseline é de 442 testes coletados; o número
# aprovado é o que o passo "Run pytest suite" imprimir no log — a aba Actions
# é a fonte autoritativa.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Permissão mínima para o GITHUB_TOKEN: o job apenas faz checkout e roda a
# suíte; não escreve no repositório, não cria release e não comenta em PR.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # Topologia de serviços:
    #   - postgres_api: PostgreSQL 16 do banco da API (bootcamp), em
    #     127.0.0.1:5432. O POSTGRES_DB cria o banco bootcamp vazio; o schema
    #     (database/database.sql) é carregado em um passo via psql.
    #   - postgres_test: um SEGUNDO servidor PostgreSQL 16, FISICAMENTE separado,
    #     para o banco de schema descartável (bootcamp_test), em 127.0.0.1:5433.
    #     Precisa ser uma instância distinta porque as fixtures de suporte
    #     comparam o system_identifier retornado por pg_control_system() — valor
    #     único POR CLUSTER físico — e exigem que o banco da API e o de teste
    #     estejam em clusters diferentes. Ambos em 127.0.0.1 (hosts iguais,
    #     portas distintas), satisfazendo também host in {localhost,127.0.0.1}.
    #   - mockserver: o provedor cadastral simulado (imagem 8.0.0). Os testes da
    #     R03 configuram as expectativas em tempo de execução pela API de
    #     controle (MockServer.reset()/expect).
    services:
      postgres_api:
        image: postgres:16
        env:
          POSTGRES_USER: bootcamp
          POSTGRES_PASSWORD: bootcamp
          POSTGRES_DB: bootcamp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bootcamp -d bootcamp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      postgres_test:
        image: postgres:16
        env:
          POSTGRES_USER: bootcamp
          POSTGRES_PASSWORD: bootcamp
          POSTGRES_DB: bootcamp_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bootcamp -d bootcamp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      mockserver:
        image: mockserver/mockserver:8.0.0
        ports:
          - 1080:1080

    env:
      # Mapeamento de ambiente — deve bater EXATAMENTE com o que
      # tests/conftest.py espera. O conftest usa os.environ.setdefault, então
      # estas variáveis exportadas no job têm precedência.
      #
      # Banco da API (bootcamp) e banco de schema descartável (bootcamp_test)
      # vivem em servidores PostgreSQL FISICAMENTE SEPARADOS (clusters distintos,
      # system_identifier distinto): bootcamp em 127.0.0.1:5432 e bootcamp_test
      # em 127.0.0.1:5433.
      DATABASE_URL: postgresql+psycopg2://bootcamp:bootcamp@127.0.0.1:5432/bootcamp
      TEST_DATABASE_URL: postgresql+psycopg2://bootcamp:bootcamp@127.0.0.1:5433/bootcamp_test
      INTERNAL_TOKEN: default_token
      ANALYSIS_PROVIDER_URL: http://127.0.0.1:1080
      MOCKSERVER_URL: http://127.0.0.1:1080
      ANALYSIS_PROVIDER_TIMEOUT: "5"
      SERVER_LOCALHOST: 127.0.0.1
      API_PORT: "3001"
      APP_ENV: test

    steps:
      # Actions oficiais pinadas por SHA de commit completo (imutável) com a
      # versão legível no comentário. Releases em runtime Node.js 24 — o GitHub
      # removeu o Node 20 dos runners; estes SHAs declaram `using: node24` na
      # origem (verificado via API do GitHub).
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Wait for PostgreSQL
        run: |
          # Aguarda AMBOS os servidores PostgreSQL: o da API (5432) e o de
          # schema descartável (5433). Só prossegue quando os dois estão prontos.
          wait_pg() {
            local port="$1"
            for i in $(seq 1 30); do
              if pg_isready -h 127.0.0.1 -p "$port" -U bootcamp >/dev/null 2>&1; then
                echo "PostgreSQL pronto na porta $port."
                return 0
              fi
              echo "Aguardando PostgreSQL na porta $port... ($i)"
              sleep 2
            done
            echo "PostgreSQL na porta $port não ficou pronto a tempo." >&2
            return 1
          }
          wait_pg 5432
          wait_pg 5433

      - name: Load schema into API database
        env:
          PGPASSWORD: bootcamp
        run: |
          # Carrega o schema (ERD) no banco da API (bootcamp, 127.0.0.1:5432).
          # O banco de schema descartável bootcamp_test já é criado vazio pelo
          # POSTGRES_DB do segundo servidor (127.0.0.1:5433): a fixture de sessão
          # em tests/integration/database/conftest.py chama DbUtils.reset_schema,
          # que executa DROP SCHEMA public CASCADE e reaplica database.sql, então
          # NÃO carregamos schema ali. Isso é SEGURO apenas porque bootcamp_test
          # é efêmero e termina em _test.
          psql "postgresql://bootcamp:bootcamp@127.0.0.1:5432/bootcamp" \
            -v ON_ERROR_STOP=1 -f database/database.sql

      - name: Wait for MockServer
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              -X PUT http://127.0.0.1:1080/mockserver/status || true)
            # O MockServer responde 200 em /mockserver/status quando está de pé.
            if [ "$code" = "200" ]; then
              echo "MockServer pronto."
              exit 0
            fi
            echo "Aguardando MockServer... ($i) [http=$code]"
            sleep 2
          done
          echo "MockServer não ficou pronto a tempo." >&2
          exit 1

      - name: Start API (uvicorn)
        run: |
          # src/database.py cria a engine na importação, então DATABASE_URL já
          # precisa estar válido e o banco acessível antes do uvicorn subir.
          cd src
          nohup python -m uvicorn app:app \
            --host 127.0.0.1 --port 3001 --no-access-log \
            > "$GITHUB_WORKSPACE/api.log" 2>&1 &
          echo "API iniciada em background (pid $!)."

      - name: Wait for API /health_check (204)
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              http://127.0.0.1:3001/health_check || true)
            if [ "$code" = "204" ]; then
              echo "API pronta (/health_check -> 204)."
              exit 0
            fi
            echo "Aguardando API... ($i) [http=$code]"
            sleep 2
          done
          echo "A API não respondeu 204 em /health_check a tempo." >&2
          echo "===== api.log =====" >&2
          cat "$GITHUB_WORKSPACE/api.log" >&2 || true
          exit 1

      - name: Run pytest suite
        run: |
          # Passo que decide pass/fail do job. Sem continue-on-error,
          # sem --maxfail, sem skip/xfail artificiais.
          python -m pytest -q -ra --junitxml=pytest-results.xml

      - name: Dump API logs on failure
        if: failure()
        run: |
          echo "===== api.log ====="
          cat "$GITHUB_WORKSPACE/api.log" || true

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-results
          path: |
            pytest-results.xml
            api.log
          if-no-files-found: ignore
          retention-days: 7
