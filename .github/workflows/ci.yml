name: CI - full test suite

# Executa a suíte REAL (442 testes: unit + integração HTTP + schema) contra
# uma stack completa provisionada pelo próprio runner: PostgreSQL, MockServer
# e a API viva (uvicorn). O Docker está quebrado na sandbox de desenvolvimento,
# então este workflow é a forma sancionada de obter evidência verde real.

on:
  push:
    branches:
      - main
      - fix/p0-test-suite-reproducibility
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Permissão mínima para o GITHUB_TOKEN (SEC-08 da auditoria P2-A). Ambos os
# jobs apenas fazem checkout e rodam a suíte/migração: nenhum escreve no
# repositório, cria release ou comenta em PR. `contents: read` é suficiente —
# o upload de artefato usa o runtime de Actions, não a permissão `contents`.
# Declarar explicitamente torna a postura resistente a mudança do default do
# repositório. Jobs podem estreitar ainda mais, mas nenhum precisa de mais.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # Topologia de serviços:
    #   - postgres_api: servidor PostgreSQL 16 do banco da API (bootcamp),
    #     exposto em 127.0.0.1:5432. Cria automaticamente o banco bootcamp
    #     (POSTGRES_DB); o schema (ERD) é carregado em um passo via psql.
    #   - postgres_test: um SEGUNDO servidor PostgreSQL 16, FISICAMENTE separado,
    #     para o banco de schema descartável (bootcamp_test), exposto em
    #     127.0.0.1:5433. Precisa ser uma instância distinta porque as fixtures
    #     de suporte (r04/r05/r06/r09) comparam o system_identifier retornado por
    #     pg_control_system() — valor único POR CLUSTER físico — e exigem que o
    #     banco da API e o banco de teste estejam em clusters diferentes. Ambos
    #     os servidores ficam acessíveis em 127.0.0.1 (hosts idênticos, portas
    #     distintas), satisfazendo também a asserção host in {localhost,127.0.0.1}.
    #   - mockserver: o provedor cadastral simulado (igual ao mockserver/Dockerfile,
    #     imagem 8.0.0). Os testes da R03 configuram expectativas em tempo de
    #     execução pela API de controle (MockServer.reset()/expect), portanto o
    #     JSON de seed NÃO é necessário para a instância de teste.
    services:
      postgres_api:
        image: postgres:16
        env:
          POSTGRES_USER: bootcamp
          POSTGRES_PASSWORD: bootcamp
          POSTGRES_DB: bootcamp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bootcamp -d bootcamp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      postgres_test:
        image: postgres:16
        env:
          POSTGRES_USER: bootcamp
          POSTGRES_PASSWORD: bootcamp
          POSTGRES_DB: bootcamp_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bootcamp -d bootcamp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      mockserver:
        image: mockserver/mockserver:8.0.0
        ports:
          - 1080:1080

    env:
      # Mapeamento de ambiente — deve bater EXATAMENTE com o que
      # tests/conftest.py espera. O conftest usa os.environ.setdefault,
      # então estas variáveis exportadas no job têm precedência.
      #
      # Banco da API (bootcamp) e banco de schema descartável (bootcamp_test)
      # vivem em servidores PostgreSQL FISICAMENTE SEPARADOS (clusters distintos,
      # system_identifier distinto): bootcamp em 127.0.0.1:5432 e bootcamp_test
      # em 127.0.0.1:5433. As fixtures de suporte exigem essa separação física e
      # também host in {localhost,127.0.0.1} para ambas as URLs.
      DATABASE_URL: postgresql+psycopg2://bootcamp:bootcamp@127.0.0.1:5432/bootcamp
      TEST_DATABASE_URL: postgresql+psycopg2://bootcamp:bootcamp@127.0.0.1:5433/bootcamp_test
      INTERNAL_TOKEN: default_token
      ANALYSIS_PROVIDER_URL: http://127.0.0.1:1080
      MOCKSERVER_URL: http://127.0.0.1:1080
      ANALYSIS_PROVIDER_TIMEOUT: "5"
      SERVER_LOCALHOST: 127.0.0.1
      API_PORT: "3001"
      APP_ENV: test

    steps:
      # Actions oficiais pinadas por SHA de commit completo (SEC-09): uma tag
      # como @v4 é mutável e pode ser reapontada; o SHA é imutável e torna o
      # build reproduzível. O comentário ao lado registra a versão legível
      # correspondente ao SHA, conforme recomendação de hardening do GitHub.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Wait for PostgreSQL
        run: |
          # Aguarda AMBOS os servidores PostgreSQL: o da API (5432) e o de
          # schema descartável (5433). Só prossegue quando os dois estão prontos.
          wait_pg() {
            local port="$1"
            for i in $(seq 1 30); do
              if pg_isready -h 127.0.0.1 -p "$port" -U bootcamp >/dev/null 2>&1; then
                echo "PostgreSQL pronto na porta $port."
                return 0
              fi
              echo "Aguardando PostgreSQL na porta $port... ($i)"
              sleep 2
            done
            echo "PostgreSQL na porta $port não ficou pronto a tempo." >&2
            return 1
          }
          wait_pg 5432
          wait_pg 5433

      - name: Load schema into API database
        env:
          PGPASSWORD: bootcamp
        run: |
          # Carrega o schema (ERD) no banco da API (bootcamp, 127.0.0.1:5432).
          # O banco de schema descartável bootcamp_test já é criado vazio pelo
          # POSTGRES_DB do segundo servidor (127.0.0.1:5433): a fixture de sessão
          # em tests/integration/database/conftest.py chama DbUtils.reset_schema,
          # que executa DROP SCHEMA public CASCADE e reaplica database.sql, então
          # NÃO carregamos schema ali. Isso é SEGURO apenas porque bootcamp_test
          # é efêmero e termina em _test.
          psql "postgresql://bootcamp:bootcamp@127.0.0.1:5432/bootcamp" \
            -v ON_ERROR_STOP=1 -f database/database.sql

      - name: Wait for MockServer
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              -X PUT http://127.0.0.1:1080/mockserver/status || true)
            # O MockServer responde 200 em /mockserver/status quando está de pé.
            if [ "$code" = "200" ]; then
              echo "MockServer pronto."
              exit 0
            fi
            echo "Aguardando MockServer... ($i) [http=$code]"
            sleep 2
          done
          echo "MockServer não ficou pronto a tempo." >&2
          exit 1

      - name: Start API (uvicorn)
        run: |
          # src/database.py cria a engine na importação, então DATABASE_URL já
          # precisa estar válido e o banco acessível antes do uvicorn subir.
          # WORKDIR da imagem é /app = src/, então rodamos a partir de src/.
          cd src
          nohup python -m uvicorn app:app \
            --host 127.0.0.1 --port 3001 --no-access-log \
            > "$GITHUB_WORKSPACE/api.log" 2>&1 &
          echo "API iniciada em background (pid $!)."

      - name: Wait for API /health_check (204)
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              http://127.0.0.1:3001/health_check || true)
            if [ "$code" = "204" ]; then
              echo "API pronta (/health_check -> 204)."
              exit 0
            fi
            echo "Aguardando API... ($i) [http=$code]"
            sleep 2
          done
          echo "A API não respondeu 204 em /health_check a tempo." >&2
          echo "===== api.log =====" >&2
          cat "$GITHUB_WORKSPACE/api.log" >&2 || true
          exit 1

      - name: Run full pytest suite
        run: |
          # Passo que decide pass/fail do job. Sem continue-on-error,
          # sem --maxfail, sem skip/xfail artificiais.
          python -m pytest -q -ra --junitxml=pytest-results.xml

      - name: Dump API logs on failure
        if: failure()
        run: |
          echo "===== api.log =====" 
          cat "$GITHUB_WORKSPACE/api.log" || true

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-results
          path: |
            pytest-results.xml
            api.log
          if-no-files-found: ignore
          # Retenção curta do artefato (SEC-10). O risco de PII em api.log já é
          # baixo — o logger usa allowlist estruturada e test_observability.py
          # assere ausência de CPF/CNPJ/e-mail/segredo/INTERNAL_TOKEN nos logs,
          # e os dados do CI são sintéticos. Limitar a retenção reduz ainda mais
          # a janela de exposição do log/relatório, sem perder a utilidade de
          # depuração logo após a execução.
          retention-days: 7

  # Job ISOLADO de validação da migração de schema POPULADO (P1-D/COD-05/COD-06).
  # NÃO substitui nem altera o job `test` (obrigatório para a main protegida):
  # roda em paralelo, com seu PRÓPRIO cluster PostgreSQL efêmero e dedicado,
  # e aplica a migração versionada via `psql -f` sobre o schema LEGADO populado,
  # comparando os dados antes/depois. Prova que a evolução de um banco já
  # povoado preserva contagem, identidade, valores e relacionamentos.
  migration:
    runs-on: ubuntu-latest

    services:
      postgres_migration:
        image: postgres:16
        env:
          POSTGRES_USER: bootcamp
          POSTGRES_PASSWORD: bootcamp
          POSTGRES_DB: bootcamp_migration_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U bootcamp -d bootcamp_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD: bootcamp
      MIG_URL: postgresql://bootcamp:bootcamp@127.0.0.1:5434/bootcamp_migration_test

    steps:
      # Mesma pinagem por SHA do job `test` (SEC-09).
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5434 -U bootcamp >/dev/null 2>&1; then
              echo "PostgreSQL de migração pronto."; break
            fi
            echo "Aguardando PostgreSQL de migração... ($i)"; sleep 2
          done

      - name: Install legacy (pre-P1-D) schema
        run: |
          # Schema LEGADO: enums como VARCHAR+CHECK e transaction_entry sem entry_key.
          psql "$MIG_URL" -v ON_ERROR_STOP=1 \
            -f tests/integration/database/legacy_schema.sql

      - name: Seed representative data (PF/PJ, contas, saldos, históricos, transações)
        run: |
          psql "$MIG_URL" -v ON_ERROR_STOP=1 <<'SQL'
          -- Cliente PF ACTIVE + perfil + eventos
          WITH c AS (
            INSERT INTO client (client_key, client_type, email, timezone, status_id, created_at, updated_at)
            VALUES (gen_random_uuid(), 'INDIVIDUAL', 'pf@example.test', 'America/Sao_Paulo',
                    (SELECT id FROM client_status WHERE enumerator='ACTIVE'), NOW(), NOW())
            RETURNING id
          )
          INSERT INTO individual_client (client_id, cpf, full_name, birth_date)
          SELECT id, '52998224725', 'Pessoa Fisica', '1990-01-01' FROM c;

          INSERT INTO client_status_event (client_id, from_status_id, to_status_id, actor_type, reason, created_at)
          SELECT c.id, NULL, (SELECT id FROM client_status WHERE enumerator='PENDING'), 'SYSTEM', NULL, NOW()
          FROM client c WHERE c.email='pf@example.test';

          -- Cliente PJ ACTIVE + perfil
          WITH c AS (
            INSERT INTO client (client_key, client_type, email, timezone, status_id, created_at, updated_at)
            VALUES (gen_random_uuid(), 'COMPANY', 'pj@example.test', 'America/Sao_Paulo',
                    (SELECT id FROM client_status WHERE enumerator='ACTIVE'), NOW(), NOW())
            RETURNING id
          )
          INSERT INTO company_client (client_id, cnpj, legal_name, trade_name)
          SELECT id, '11222333000181', 'Empresa Teste Ltda', NULL FROM c;

          -- Contas (PF e PJ)
          INSERT INTO account (account_key, client_id, status_id, balance_cents, created_at, updated_at)
          SELECT gen_random_uuid(), c.id, (SELECT id FROM account_status WHERE enumerator='ACTIVE'),
                 59800, NOW(), NOW()
          FROM client c WHERE c.email='pf@example.test';
          INSERT INTO account (account_key, client_id, status_id, balance_cents, created_at, updated_at)
          SELECT gen_random_uuid(), c.id, (SELECT id FROM account_status WHERE enumerator='ACTIVE'),
                 540000, NOW(), NOW()
          FROM client c WHERE c.email='pj@example.test';

          INSERT INTO account_status_event (account_id, from_status_id, to_status_id, actor_type, reason, created_at)
          SELECT a.id, NULL, (SELECT id FROM account_status WHERE enumerator='ACTIVE'), 'SYSTEM', NULL, NOW()
          FROM account a;

          -- Depósito PF
          WITH t AS (
            INSERT INTO financial_transaction (transaction_key, request_control_key, request_hash, transaction_type, created_at)
            VALUES (gen_random_uuid(), gen_random_uuid(), repeat('a',64), 'DEPOSIT', NOW())
            RETURNING id
          )
          INSERT INTO transaction_entry (transaction_id, account_id, direction, entry_type, amount_cents, balance_after_cents, created_at)
          SELECT t.id, a.id, 'CREDIT', 'PRINCIPAL', 100000, 100000, NOW()
          FROM t, account a JOIN client c ON c.id=a.client_id WHERE c.email='pf@example.test';

          -- Transferência PF -> PJ (principal + tarifa na origem, crédito no destino)
          WITH t AS (
            INSERT INTO financial_transaction (transaction_key, request_control_key, request_hash, transaction_type, created_at)
            VALUES (gen_random_uuid(), gen_random_uuid(), repeat('c',64), 'TRANSFER', NOW())
            RETURNING id
          )
          INSERT INTO transaction_entry (transaction_id, account_id, direction, entry_type, amount_cents, balance_after_cents, created_at)
          SELECT t.id, src.id, 'DEBIT', 'PRINCIPAL', 40000, 60000, NOW()
          FROM t, account src JOIN client c ON c.id=src.client_id WHERE c.email='pf@example.test';
          SQL

      - name: Snapshot BEFORE
        run: |
          psql "$MIG_URL" -At -v ON_ERROR_STOP=1 -c "
            SELECT 'clients='||count(*) FROM client
            UNION ALL SELECT 'entries='||count(*) FROM transaction_entry
            UNION ALL SELECT 'txns='||count(*) FROM financial_transaction
            UNION ALL SELECT 'sum_balance='||COALESCE(sum(balance_cents),0) FROM account
          " | tee before.txt

      - name: Apply versioned migration (psql)
        run: |
          psql "$MIG_URL" -v ON_ERROR_STOP=1 \
            -f database/migrations/0001_cod05_cod06_lookup_and_entry_key.sql

      - name: Snapshot AFTER and assert integrity
        run: |
          psql "$MIG_URL" -At -v ON_ERROR_STOP=1 -c "
            SELECT 'clients='||count(*) FROM client
            UNION ALL SELECT 'entries='||count(*) FROM transaction_entry
            UNION ALL SELECT 'txns='||count(*) FROM financial_transaction
            UNION ALL SELECT 'sum_balance='||COALESCE(sum(balance_cents),0) FROM account
          " | tee after.txt
          echo "=== BEFORE ==="; cat before.txt
          echo "=== AFTER ==="; cat after.txt
          if ! diff -u before.txt after.txt; then
            echo "FALHA: contagens/saldos divergiram após a migração." >&2
            exit 1
          fi
          # entry_key total e único; nenhuma FK nova nula; lookups criadas.
          psql "$MIG_URL" -At -v ON_ERROR_STOP=1 -c "
            DO \$check\$
            BEGIN
              IF (SELECT count(*) FROM transaction_entry)
                 <> (SELECT count(DISTINCT entry_key) FROM transaction_entry)
                 OR EXISTS (SELECT 1 FROM transaction_entry WHERE entry_key IS NULL) THEN
                RAISE EXCEPTION 'entry_key ausente/duplicado';
              END IF;
              IF EXISTS (SELECT 1 FROM client WHERE client_type_id IS NULL)
                 OR EXISTS (SELECT 1 FROM financial_transaction WHERE transaction_type_id IS NULL)
                 OR EXISTS (SELECT 1 FROM transaction_entry WHERE direction_id IS NULL OR entry_type_id IS NULL) THEN
                RAISE EXCEPTION 'FK nova nula após migração';
              END IF;
              IF to_regclass('public.client_type') IS NULL
                 OR to_regclass('public.actor_type') IS NULL THEN
                RAISE EXCEPTION 'lookup não criada';
              END IF;
            END
            \$check\$;
          "
          echo "Migração populada validada com sucesso."

      - name: Assert migration is idempotent (re-run is a no-op)
        run: |
          psql "$MIG_URL" -v ON_ERROR_STOP=1 \
            -f database/migrations/0001_cod05_cod06_lookup_and_entry_key.sql
          psql "$MIG_URL" -At -v ON_ERROR_STOP=1 -c "
            SELECT 'clients='||count(*) FROM client
            UNION ALL SELECT 'entries='||count(*) FROM transaction_entry
            UNION ALL SELECT 'txns='||count(*) FROM financial_transaction
            UNION ALL SELECT 'sum_balance='||COALESCE(sum(balance_cents),0) FROM account
          " | tee after2.txt
          if ! diff -u after.txt after2.txt; then
            echo "FALHA: reexecutar a migração alterou os dados (não idempotente)." >&2
            exit 1
          fi
          # Lookups não duplicaram valores.
          psql "$MIG_URL" -At -v ON_ERROR_STOP=1 -c "
            DO \$idem\$
            BEGIN
              IF (SELECT count(*) FROM actor_type) <> (SELECT count(DISTINCT enumerator) FROM actor_type)
                 OR (SELECT count(*) FROM client_type) <> (SELECT count(DISTINCT enumerator) FROM client_type) THEN
                RAISE EXCEPTION 'lookup duplicou na reexecução';
              END IF;
            END
            \$idem\$;
          "
          echo "Idempotência da migração confirmada."

      - name: Validate rollback restores legacy schema AND preserves data
        run: |
          psql "$MIG_URL" -v ON_ERROR_STOP=1 \
            -f database/migrations/0001_ROLLBACK.sql
          # Estrutura: colunas textuais de volta, lookups removidas.
          psql "$MIG_URL" -At -v ON_ERROR_STOP=1 -c "
            DO \$rb\$
            BEGIN
              IF NOT EXISTS (
                SELECT 1 FROM information_schema.columns
                WHERE table_schema='public' AND table_name='client' AND column_name='client_type'
              ) THEN
                RAISE EXCEPTION 'rollback não restaurou client.client_type';
              END IF;
              IF to_regclass('public.client_type') IS NOT NULL THEN
                RAISE EXCEPTION 'rollback não removeu a lookup client_type';
              END IF;
            END
            \$rb\$;
          "
          # Dados: contagens e soma de saldos idênticas ao estado original
          # (lossless para dados de negócio no round-trip migrate->rollback).
          psql "$MIG_URL" -At -v ON_ERROR_STOP=1 -c "
            SELECT 'clients='||count(*) FROM client
            UNION ALL SELECT 'entries='||count(*) FROM transaction_entry
            UNION ALL SELECT 'txns='||count(*) FROM financial_transaction
            UNION ALL SELECT 'sum_balance='||COALESCE(sum(balance_cents),0) FROM account
          " | tee rolled_back.txt
          if ! diff -u before.txt rolled_back.txt; then
            echo "FALHA: rollback perdeu/alterou dados de negócio." >&2
            exit 1
          fi
          # Texto das enumerações preservado após o round-trip completo.
          psql "$MIG_URL" -At -v ON_ERROR_STOP=1 -c "
            DO \$txt\$
            BEGIN
              IF NOT EXISTS (
                SELECT 1 FROM transaction_entry
                WHERE direction IN ('DEBIT','CREDIT') AND entry_type IN ('PRINCIPAL','FEE')
              ) THEN
                RAISE EXCEPTION 'rollback não restaurou o texto de direction/entry_type';
              END IF;
              IF EXISTS (SELECT 1 FROM financial_transaction
                         WHERE transaction_type NOT IN ('DEPOSIT','TRANSFER')) THEN
                RAISE EXCEPTION 'rollback corrompeu transaction_type';
              END IF;
            END
            \$txt\$;
          "
          echo "Rollback validado: estrutura legada restaurada e dados preservados."
